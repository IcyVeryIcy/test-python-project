[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-calculator"
version = "0.1.0"
description = "Texas Hold'em hand evaluation and equity/odds calculation library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Tan Man" },
]
keywords = ["poker", "holdem", "texas-holdem", "hand-evaluation", "equity", "odds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/example/poker-calculator"
Documentation = "https://github.com/example/poker-calculator#readme"
Issues = "https://github.com/example/poker-calculator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_calculator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
